name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow this workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Auto-enable Pages (build type "workflow") so the repo owner needn't toggle
      # it by hand; harmless if Pages is already enabled.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static export
        # Project Pages serve under /<repo>; set basePath accordingly. Repo name is
        # passed via env (safe) rather than interpolated into a shell command.
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm build
      - run: touch packages/web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
