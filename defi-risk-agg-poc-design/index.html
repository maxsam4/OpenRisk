  <!--
    OpenRisk — design rationale
    ---------------------------
    Aesthetic: a data tool, not a crypto product. Near-black canvas, all-monospace
    (JetBrains Mono), hairline borders, tabular numerals — the L2Beat / DeFiScan
    lineage the brief asks for. Neutral and infrastructural; no hype, no gradients.

    Coverage palette is deliberately NOT a good/bad scale: a filled green dot = covered,
    amber = partial, hollow grey + em-dash = not-yet-covered. These read as coverage
    states, never as quality grades — there is no quality grade. The only "accent" is a
    periwinkle used for links and interactive state, kept far from the coverage hues.

    No element computes, ranks, normalizes, or implies a composite score. The matrix is
    sortable by name / category / TVL only. Each feed's verdict appears solely in that
    feed's own words, with a source link and a provenance tag.

    Accessibility: WCAG-AA contrast in both themes; coverage is encoded by shape + label,
    not color alone (dot fill vs. hollow + text); tables use real <th>; keyboard-operable
    controls; reduced-motion respected on view transitions.
  -->
</head>
